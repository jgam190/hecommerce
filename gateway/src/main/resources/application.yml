server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                  - "http://localhost:5173"
                  - "http://localhost:8081"
                  - "https://*.app.github.dev"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                allowed-headers: "*"
                max-age: 3600

services:
  products:
    base-url: ${PRODUCTS_SERVICE_URL:http://localhost:8081}
  orders:
    base-url: ${ORDERS_SERVICE_URL:http://localhost:8082}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8083}
