server:
  port: 8085

spring:
  application:
    name: notifications-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.br.unifor.notifications.mensageria.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.br.unifor.notifications.mensageria.dto.PedidoEvent

app:
  kafka:
    topic:
      pedido: ${APP_KAFKA_TOPIC_PEDIDO:pedido-criado-topic}